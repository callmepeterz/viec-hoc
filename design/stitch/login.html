rem","space-sm":"0.5rem","gutter":"1.5rem","space-lg":"1.5rem","margin-mobile":"1rem","margin":"2rem"},"fontFamily":{"headline-lg":["Be Vietnam Pro"],"display-lg":["Be Vietnam Pro"],"headline-md":["Be Vietnam Pro"],"body-sm":["Be Vietnam Pro"],"headline-sm":["Be Vietnam Pro"],"body-md":["Be Vietnam Pro"],"headline-lg-mobile":["Be Vietnam Pro"],"label-md":["Be Vietnam Pro"],"body-lg":["Be Vietnam Pro"],"label-lg":["Be Vietnam Pro"],"label-sm":["Be Vietnam Pro"],"display-lg-mobile":["Be Vietnam Pro"]},"fontSize":{"headline-lg":["32px",{"lineHeight":"42px","letterSpacing":"-0.015em","fontWeight":"600"}],"display-lg":["40px",{"lineHeight":"52px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["22px",{"lineHeight":"30px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"20px","fontWeight":"400"}],"headline-sm":["18px",{"lineHeight":"26px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"22px","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"18px","letterSpacing":"0.02em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"26px","fontWeight":"400"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"display-lg-mobile":["30px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface antialiased"><main class="w-full bg-surface min-h-screen flex items-center justify-center p-gutter"><div class="flex flex-col w-full">
<div class="relative w-full flex items-center justify-center py-10 px-4 sm:px-6">
<div class="absolute -top-12 -left-12 w-96 h-96 bg-primary-fixed/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-16 -right-12 w-80 h-80 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative w-full max-w-[460px] bg-surface-container-lowest shadow-xl rounded-xl p-8 sm:p-10 flex flex-col">
<div class="flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-xl bg-surface-container-low flex items-center justify-center p-2 mb-4 shadow-sm">
<img alt="Logo Việc Học Của Tôi" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1WuJn510fXiu61w8x2uX9VCD-OptpQfpvMtvx0Auni0NPzpBjYNHx7iikmNNl7yxwTXtp0laDdThhS7SPl4fEvoGsl0DDMo_ukMwQ6t58uuvpVGt20Gb6eyv3EkT-8Cm-Pg8HfQYVs555PyWfD5IaQLVxda01v3rUNIlQsbIRsbOn4skDoAGiWKr9Vv7JJdjXWLX2D58v3imTw7O_EpoApxcYfomYTNCbyrCBuLp0R9Rmn0-4ZfzABJwMQ"/>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
          Việc học của tôi
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5">
          Đăng nhập vào tài khoản học tập
        </p>
</div>
<div class="mt-8 flex items-center gap-2 p-3 bg-surface-container-low rounded-lg text-primary text-body-sm font-body-sm">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span>Không gian học tập cá nhân tập trung và hiệu quả mỗi ngày.</span>
</div>
<form class="mt-6 flex flex-col gap-5" id="authForm" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="email">
<span>Email</span>
<span class="text-error text-label-sm font-label-sm hidden" id="emailError">Email không hợp lệ</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full pl-11 pr-4 py-2.5 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg placeholder-outline focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all duration-200" id="email" placeholder="hocvien@viethoc.edu.vn" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="password">
<span>Mật khẩu</span>
<span class="text-error text-label-sm font-label-sm hidden" id="passwordError">Vui lòng nhập mật khẩu</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full pl-11 pr-11 py-2.5 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg placeholder-outline focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all duration-200" id="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button aria-label="Ẩn hiện mật khẩu" class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center cursor-pointer" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container-high peer-checked:bg-secondary flex items-center justify-center transition-all duration-150">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-tertiary transition-colors" href="#quen-mat-khau">
            Quên mật khẩu?
          </a>
</div>
<button class="w-full mt-2 py-3 px-6 bg-primary hover:bg-tertiary text-on-primary font-label-lg text-label-lg rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer" id="submitBtn" type="submit">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 bg-surface-container-low/50 -mx-8 -mb-8 sm:-mx-10 sm:-mb-10 px-8 py-5 sm:px-10 rounded-b-xl flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
<span class="font-body-sm text-body-sm text-on-surface-variant">Chưa có tài khoản học tập?</span>
<a class="font-label-md text-label-md text-primary hover:text-tertiary font-semibold transition-colors flex items-center gap-1" href="#dang-ky">
<span>Tạo tài khoản mới</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</div>
</div>
</div>
<div class="text-center mt-6">
<p class="font-label-sm text-label-sm text-outline">
      © 2025 Việc học của tôi. Môi trường học tập chủ động và tiến bộ.
    </p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const icon = document.getElementById('pwdIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleSubmit() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const submitBtn = document.getElementById('submitBtn');

    if (!email || !password) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
      <span>Đang xác thực...</span>
    `;

    setTimeout(() => {
      submitBtn.classList.remove('bg-primary');
      submitBtn.classList.add('bg-secondary');
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">done</span>
        <span>Thành công! Đang chuyển hướng...</span>
      `;
    }, 1200);
  }
</script></main></body></html>
